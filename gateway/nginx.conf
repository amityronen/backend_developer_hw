# Plays the role of the load balancer in front of the services (path-based routing).
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    resolver 127.0.0.11 valid=5s;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location /api/catalog/ {
        set $catalog_upstream http://catalog:8000;
        proxy_pass $catalog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/ {
        set $admin_upstream http://admin:8000;
        proxy_pass $admin_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
