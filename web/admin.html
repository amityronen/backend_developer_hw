<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melon Market - Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site">
    <h1>Melon Market - Admin</h1>
    <span><a href="/">Shop</a> <button id="logout" class="secondary" type="button">Log out</button></span>
  </header>
  <main>
    <section id="login-panel" class="panel hidden">
      <h2>Sign in</h2>
      <form id="login-form" class="form-grid">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="app-panel" class="hidden">
      <div class="panel">
        <h2>Add item</h2>
        <form id="add-form" class="form-grid">
          <label>Half of <select name="half_of" id="half-of"></select></label>
          <label>Name <input name="name"></label>
          <label>Description <input name="description"></label>
          <label>Weight (kg) <input name="weight_kg" type="number" step="0.01" min="0.01"></label>
          <label>Price (ILS) <input name="price" type="number" step="0.01" min="0.01"></label>
          <label>Quantity <input name="quantity" type="number" step="1" min="0" value="0"></label>
          <button type="submit">Add</button>
        </form>
        <p class="empty">For a half item pick the whole item: the name, weight and price are derived.</p>
      </div>

      <div class="panel">
        <div class="row" style="margin-top:0">
          <h2 style="margin:0">Items</h2>
          <label>Sort by
            <select id="sort">
              <option value="id">id</option>
              <option value="name">name</option>
              <option value="price">price</option>
              <option value="quantity">quantity</option>
            </select>
          </label>
        </div>
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
